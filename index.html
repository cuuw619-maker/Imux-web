<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <meta name="description" content="Imux Web voxel game">
  <title>Imux Web</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>

  <div id="menu">
    <div id="menu-overlay"></div>
    <div class="menu-card">
      <div class="menu-title">IMUX</div>
      <div class="menu-subtitle">WEB VOXEL GAME</div>
      <button id="play" type="button">PLAY</button>
    </div>
  </div>

  <div id="crosshair"><img src="./assets/minecraft/textures/gui/crosshair.png" alt=""></div>

  <div id="attack-indicator" class="hidden" aria-hidden="true">
    <img id="attack-background" src="./assets/minecraft/textures/gui/crosshair_attack_indicator_background.png" alt="">
    <img id="attack-progress" src="./assets/minecraft/textures/gui/crosshair_attack_indicator_progress.png" alt="">
    <img id="attack-full" class="hidden" src="./assets/minecraft/textures/gui/crosshair_attack_indicator_full.png" alt="">
  </div>

  <div id="hud">
    <div id="status">IMUX • DEV BUILD</div>
    <div id="target"></div>
  </div>

  <div id="hunger" aria-label="Hunger">
    <span class="hunger-icon"></span><span class="hunger-icon"></span>
    <span class="hunger-icon"></span><span class="hunger-icon"></span>
    <span class="hunger-icon"></span><span class="hunger-icon"></span>
    <span class="hunger-icon"></span><span class="hunger-icon"></span>
    <span class="hunger-icon"></span><span class="hunger-icon"></span>
  </div>

  <div id="offhand-left" class="hidden"><img src="./assets/minecraft/textures/gui/hotbar_offhand_left.png" alt=""></div>
  <div id="offhand-right" class="hidden"><img src="./assets/minecraft/textures/gui/hotbar_offhand_right.png" alt=""></div>

  <div id="hotbar" aria-label="Hotbar">
    <button class="slot selected" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
  </div>

  <div id="tuning" class="hidden" aria-label="Imux render and hitbox tuning">
    <div id="tuning-window">
      <div class="tuning-title">IMUX RENDER / HITBOX TUNER</div>
      <div class="tuning-hint">R close • K copy JSON • changes are saved locally</div>

      <div class="tuning-grid">
        <label data-tune-row="renderScale">Render scale <output></output><input data-tune="renderScale" type="range" min="0.5" max="2" step="0.05"></label>
        <label data-tune-row="guiScale">GUI scale <output></output><input data-tune="guiScale" type="range" min="1" max="4" step="1"></label>
        <label data-tune-row="gameFov">Game FOV <output></output><input data-tune="gameFov" type="range" min="50" max="110" step="1"></label>
        <label data-tune-row="reach">Block reach <output></output><input data-tune="reach" type="range" min="2" max="12" step="0.1"></label>

        <label data-tune-row="playerRadius">Hitbox radius <output></output><input data-tune="playerRadius" type="range" min="0.10" max="0.50" step="0.01"></label>
        <label data-tune-row="playerHeight">Hitbox height <output></output><input data-tune="playerHeight" type="range" min="1" max="2.5" step="0.01"></label>
        <label data-tune-row="eyeHeight">Eye height <output></output><input data-tune="eyeHeight" type="range" min="0.6" max="2.2" step="0.01"></label>
        <label data-tune-row="stepHeight">Step height <output></output><input data-tune="stepHeight" type="range" min="0" max="1" step="0.01"></label>

        <label data-tune-row="sneakHeight">Sneak height <output></output><input data-tune="sneakHeight" type="range" min="0.8" max="2" step="0.01"></label>
        <label data-tune-row="sneakEyeHeight">Sneak eye <output></output><input data-tune="sneakEyeHeight" type="range" min="0.6" max="1.7" step="0.01"></label>
        <label data-tune-row="menuFov">Panorama FOV <output></output><input data-tune="menuFov" type="range" min="75" max="120" step="1"></label>
        <label data-tune-row="menuPitch">Panorama pitch <output></output><input data-tune="menuPitch" type="range" min="-45" max="-5" step="0.5"></label>
        <label data-tune-row="menuSpeed">Panorama speed <output></output><input data-tune="menuSpeed" type="range" min="0" max="5" step="0.05"></label>
      </div>

      <div class="tuning-footer">
        <button id="tuning-reset" type="button">RESET</button>
        <span id="tuning-status">R close • K copy JSON</span>
      </div>
    </div>
  </div>

  <div id="inventory" class="hidden">
    <div id="inventory-window">
      <div id="inventory-slots"></div>
    </div>
  </div>

  <div id="help">
    <strong>Click to play</strong>
    <span>WASD</span>
    <span>Shift sprint</span>
    <span>Ctrl sneak</span>
    <span>Space jump</span>
    <span>LMB break</span>
    <span>RMB place</span>
    <span>Wheel select</span>
    <span>E inventory</span>
    <span>R tune</span>
    <span>K JSON</span>
    <span>Esc release</span>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
