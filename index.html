<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <meta name="description" content="Imux Web - browser voxel game prototype">
  <title>Imux Web</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>

  <div id="menu">
    <div class="menu-card">
      <div class="menu-title">IMUX</div>
      <div class="menu-subtitle">WEB VOXEL PROTOTYPE</div>
      <button id="play" type="button">PLAY</button>
    </div>
  </div>

  <div id="crosshair" aria-hidden="true"></div>
  <div id="hud">
    <div id="status">IMUX • DEV BUILD</div>
    <div id="target"></div>
  </div>

  <div id="hotbar" aria-label="Hotbar">
    <button class="slot selected" data-index="0" aria-label="Slot"></button>
    <button class="slot" data-index="1" aria-label="Slot"></button>
    <button class="slot" data-index="2" aria-label="Slot"></button>
    <button class="slot" data-index="3" aria-label="Slot"></button>
    <button class="slot" data-index="4" aria-label="Slot"></button>
    <button class="slot" data-index="5" aria-label="Slot"></button>
    <button class="slot" data-index="6" aria-label="Slot"></button>
    <button class="slot" data-index="7" aria-label="Slot"></button>
    <button class="slot" data-index="8" aria-label="Slot"></button>
  </div>

  <div id="help">
    <strong>Click to play</strong>
    <span>WASD move</span>
    <span>Space jump</span>
    <span>LMB break</span>
    <span>RMB place</span>
    <span>Mouse wheel select</span>
    <span>Esc release mouse</span>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
